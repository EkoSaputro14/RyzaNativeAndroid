name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional custom release tag (defaults to v<versionName>)'
        required: false
        default: ''
      create_release:
        description: 'Publish GitHub Release'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build arm64-v8a APK & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run companion verification tests
        run: python3 companion/tests/test_ryza_fixes.py

      - name: Install Android SDK, NDK r30, and CMake
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n1)
          [ -x "$SDKMANAGER" ] || { echo "sdkmanager not found under $ANDROID_HOME"; exit 1; }
          echo "Using ANDROID_HOME=$ANDROID_HOME, sdkmanager=$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "cmake;3.30.4"

          if [ ! -d "$ANDROID_HOME/ndk/30.0.16248370" ]; then
            if ! "$SDKMANAGER" --install "ndk;30.0.16248370"; then
              echo "Falling back to direct android-ndk-r30-linux.zip download..."
              curl -fsSL -o /tmp/ndk-r30.zip https://dl.google.com/android/repository/android-ndk-r30-linux.zip
              mkdir -p "$ANDROID_HOME/ndk" /tmp/ndk-extract
              unzip -q /tmp/ndk-r30.zip -d /tmp/ndk-extract
              mv /tmp/ndk-extract/android-ndk-r30 "$ANDROID_HOME/ndk/30.0.16248370"
              rm -rf /tmp/ndk-r30.zip /tmp/ndk-extract
            fi
          fi

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_LINUX=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmake/3.30.4/bin" >> "$GITHUB_PATH"

      - name: Cache Android native dependency sources and outputs
        uses: actions/cache@v4
        with:
          path: |
            android/deps/src
            android/deps/out
          key: android-deps-arm64-${{ hashFiles('android/deps/*.sh', 'android/deps/*.patch') }}
          restore-keys: |
            android-deps-arm64-

      - name: Cache Gradle packages and wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/botwrecompandroid/**/*.gradle*', 'android/botwrecompandroid/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache persistent Android debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Ensure consistent Android debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build native Android dependencies (SDL3, shaderc, Vulkan headers, FFmpeg, on-device gen tools)
        shell: bash
        run: |
          set -euo pipefail
          bash android/deps/build_deps.sh
          bash android/deps/build_ffmpeg.sh
          bash android/deps/build_gen_deps.sh

      - name: Extract app version metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_FILE="android/botwrecompandroid/app/build.gradle.kts"
          VERSION_NAME=$(sed -nE 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$GRADLE_FILE" | head -n1)
          VERSION_CODE=$(sed -nE 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' "$GRADLE_FILE" | head -n1)
          SHORT_SHA=$(git rev-parse --short HEAD)

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RELEASE_TAG="${{ github.ref_name }}"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            RELEASE_TAG="${{ inputs.release_tag }}"
          else
            RELEASE_TAG="v${VERSION_NAME}"
          fi

          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION_NAME} (code ${VERSION_CODE}), commit ${SHORT_SHA}, tag ${RELEASE_TAG}"

      - name: Build Android APKs (Release & Debug)
        working-directory: android/botwrecompandroid
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Package release APKs & checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="${{ steps.meta.outputs.version_name }}"
          mkdir -p dist

          RELEASE_APK=$(find android/botwrecompandroid/app/build/outputs/apk/release -maxdepth 2 -name '*.apk' | head -n1)
          DEBUG_APK=$(find android/botwrecompandroid/app/build/outputs/apk/debug -maxdepth 2 -name '*.apk' | head -n1)

          [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ] || { echo "Release APK not found"; exit 1; }
          [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ] || { echo "Debug APK not found"; exit 1; }

          cp "$RELEASE_APK" "dist/RyzaNativeAndroid-v${VERSION_NAME}-arm64-release.apk"
          cp "$DEBUG_APK" "dist/RyzaNativeAndroid-v${VERSION_NAME}-arm64-debug.apk"

          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist/
          cat dist/SHA256SUMS.txt

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RyzaNativeAndroid-v${{ steps.meta.outputs.version_name }}-apks
          path: dist/*
          retention-days: 30

      - name: Create or Update GitHub Release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.create_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.release_tag }}"
          VERSION_NAME="${{ steps.meta.outputs.version_name }}"
          VERSION_CODE="${{ steps.meta.outputs.version_code }}"
          SHORT_SHA="${{ steps.meta.outputs.short_sha }}"
          TITLE="RyzaNativeAndroid ${TAG}"

          {
            echo "## RyzaNativeAndroid ${TAG}"
            echo ""
            echo "- **Version:** \`${VERSION_NAME}\` (versionCode \`${VERSION_CODE}\`)"
            echo "- **Commit:** \`${SHORT_SHA}\`"
            echo "- **ABI:** \`arm64-v8a\`"
            echo "- **Min / Target / Compile SDK:** 28 / 34 / 36 (NDK r30 \`30.0.16248370\`)"
            echo ""
            echo "### Assets"
            echo "- \`RyzaNativeAndroid-v${VERSION_NAME}-arm64-release.apk\` — Release APK build (debug-signed when no custom keystore is configured)"
            echo "- \`RyzaNativeAndroid-v${VERSION_NAME}-arm64-debug.apk\` — Debug APK build (with runtime \`-O2 -g\` native flags)"
            echo "- \`SHA256SUMS.txt\` — SHA-256 checksums for APK verification"
          } > /tmp/release_notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing release $TAG..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -f "$TAG" "$GITHUB_SHA"
            git push -f origin "refs/tags/$TAG"
            gh release edit "$TAG" --title "$TITLE" --notes-file /tmp/release_notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file /tmp/release_notes.md
          fi
